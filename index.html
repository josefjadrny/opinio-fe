<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Unversioned on purpose: Google keeps the favicon URL it last saw and drops
         the icon from search when that URL 404s. These names ship with a 1-day
         cache (deploy.yml), not the immutable one, so the artwork can change in
         place without a rename. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover: Android 16 (targetSdk 36) forces every app edge-to-edge
         and the opt-out is ignored, so the installed app draws behind the status
         and gesture bars. Opting in here is what exposes env(safe-area-inset-*)
         to CSS; the mobile chrome pads itself with those insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://api.opinio.live" crossorigin />
    <link rel="dns-prefetch" href="https://images.opinio.live" />
    <title>Opinio - Ask the world, see how every country votes</title>
    <meta
      name="description"
      content="Ask the world anything and vote on polls in your own language. See how people in every country answered, live on the world map. Ad-free, made in Europe."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Opinio" />
    <meta name="theme-color" content="#10162e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Opinio" />
    <link rel="canonical" href="https://opinio.live/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Opinio" />
    <meta property="og:url" content="https://opinio.live/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="cs_CZ" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:locale:alternate" content="de_DE" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="it_IT" />
    <meta property="og:locale:alternate" content="pl_PL" />
    <meta property="og:title" content="Opinio - Ask the world, see how every country votes" />
    <meta
      property="og:description"
      content="Ask the world anything and vote on polls in your own language. See how people in every country answered, live on the world map. Ad-free, made in Europe."
    />
    <meta property="og:image" content="https://opinio.live/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Opinio - ask the world, see how every country votes" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Opinio - Ask the world, see how every country votes" />
    <meta
      name="twitter:description"
      content="Ask the world anything and vote on polls in your own language. See how people in every country answered, live on the world map. Ad-free, made in Europe."
    />
    <meta name="twitter:image" content="https://opinio.live/og-image.png" />
    <meta name="twitter:image:alt" content="Opinio - ask the world, see how every country votes" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://opinio.live/#organization",
            "name": "Opinio",
            "url": "https://opinio.live/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://opinio.live/pwa-512x512-v2.png",
              "width": 512,
              "height": 512
            },
            "sameAs": ["https://www.facebook.com/opinio.live"]
          },
          {
            "@type": "WebSite",
            "@id": "https://opinio.live/#website",
            "name": "Opinio",
            "url": "https://opinio.live/",
            "description": "Opinio is a world poll: anyone can ask a question, people everywhere vote in their own language, and the map shows how each country answered. Every poll is translated automatically into English, Czech, Spanish, German, French, Italian and Polish. Ad-free, made in Europe.",
            "inLanguage": ["en", "cs", "es", "de", "fr", "it", "pl"],
            "publisher": { "@id": "https://opinio.live/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://opinio.live/?country={country}",
              "query-input": "required name=country"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
